    sdk: flutter
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0

flutter:
  # This package does not contain any Flutter-specific functionality
  # but is compatible with Flutter applications
