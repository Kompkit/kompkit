name: Web CI

on:
  push:
    branches: [release, develop]
    paths:
      - "packages/**"
      - "!packages/core/android/**"
      - "!packages/core/flutter/**"
      - "package*.json"
      - "lerna.json"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [release, develop]
    paths:
      - "packages/**"
      - "!packages/core/android/**"
      - "!packages/core/flutter/**"
      - "package*.json"
      - "lerna.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint+build+test+docs)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip web]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:web

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm run test:web

      - name: Generate Web API docs
        run: npm run docs:web || echo "Doc generation failed (non-blocking)"

      - name: Upload web docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-docs-${{ github.run_id }}
          path: docs/api/web
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: |
            packages/*/dist/
            packages/*/build/
          if-no-files-found: ignore
          retention-days: 7
