name: Release

on:
  push:
    branches: [release]
    paths:
      - "packages/core/web/**"
      - "packages/core/flutter/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm (kompkit-core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:web

      - name: Run tests
        run: npm run test:web

      - name: Publish to npm
        run: npm publish --access public
        working-directory: packages/core/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pub:
    name: Publish to pub.dev (kompkit_core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: "stable"

      - name: Get dependencies
        working-directory: packages/core/flutter
        run: flutter pub get

      - name: Analyze
        working-directory: packages/core/flutter
        run: flutter analyze

      - name: Run tests
        working-directory: packages/core/flutter
        run: flutter test

      - name: Setup pub credentials
        run: |
          mkdir -p $HOME/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > $HOME/.config/dart/pub-credentials.json

      - name: Publish to pub.dev
        working-directory: packages/core/flutter
        run: dart pub publish --force
